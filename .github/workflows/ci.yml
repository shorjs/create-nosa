name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup Node for generated-project tests
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Setup pnpm for generated-project tests
        uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.6.0'
          run_install: false

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run ts:check

      - name: Test
        run: bun test
